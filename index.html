<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <aside class="panel panel-left" id="reference-panel">
        <button id="help-close" type="button" aria-label="Cerrar ayuda">✕</button>

        <div class="panel-section legend">
          <span class="label">EFECTOS</span>
          <ul id="powerup-legend"></ul>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLES</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>H</kbd> ayuda</li>
          </ul>
        </div>

        <div class="panel-section records-section">
          <span class="label">RECORDS</span>
          <ol id="records-list" class="records-list"></ol>
          <div class="records-stats">
            <span id="best-combo-label" class="records-stat"></span>
            <span id="max-lines-label" class="records-stat"></span>
          </div>
          <button id="reset-records-btn" class="reset-btn" type="button">Resetear récords</button>
        </div>
      </aside>

      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>

            <div id="overlay-records" class="overlay-records hidden">
              <div id="highscore-form" class="highscore-form hidden">
                <label for="player-name-input">¡Puntuación guardable! Tu nombre:</label>
                <input id="player-name-input" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
                <button id="save-score-btn" type="button">Guardar</button>
              </div>

              <span class="label">RECORDS</span>
              <ol id="overlay-records-list" class="records-list"></ol>
              <div class="records-stats">
                <span id="overlay-best-combo" class="records-stat"></span>
                <span id="overlay-max-lines" class="records-stat"></span>
              </div>
            </div>

            <button id="restart-btn">Reiniciar</button>
          </div>
        </div>
      </div>

      <aside class="panel panel-right">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section powerup">
          <span class="label">POWER-UP</span>
          <span class="value small" id="powerup-countdown">en 10 líneas</span>
          <span class="powerup-hint" id="powerup-hint"></span>
          <span class="powerup-status" id="powerup-status"></span>
        </div>

        <div class="panel-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" title="Tema oscuro" aria-label="Tema oscuro">🌙</button>
          <button id="help-toggle" class="icon-btn" type="button" aria-expanded="false" title="Ayuda" aria-label="Ayuda">❓</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
